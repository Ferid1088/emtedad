# Local metasearch for Emtedad research (no API keys needed).
use_default_settings: true
general:
  instance_name: "emtedad-search"
server:
  # Only reachable from this machine (see docker-compose.yml port binding).
  secret_key: "emtedad-local-only-change-if-exposed"
  limiter: false
  image_proxy: false
search:
  safe_search: 1
  formats:
    - html
    - json
outgoing:
  # The default 3 s is too tight for the engines that still answer us;
  # a slow engine should be waited for, not dropped.
  request_timeout: 12.0
  max_request_timeout: 20.0
engines:
  # SearXNG's default `general` set only carries three real web engines —
  # duckduckgo, google cse and brave. All three answer this machine with
  # "too many requests" / timeouts (verified 2026-10-07), which left text
  # search at zero hits. The engines below answered reliably in the same
  # probe and are enabled in addition to the defaults; the defaults stay on
  # so searches recover automatically once the rate limits expire.
  # Persian coverage comes from yahoo + yandex, English additionally from
  # mojeek, startpage, marginalia and mwmbl.
  - {name: yahoo, disabled: false}
  - {name: yandex, disabled: false}
  - {name: seznam, disabled: false}
  - {name: mojeek, disabled: false}
  - {name: startpage, disabled: false}
  - {name: marginalia, disabled: false}
  - {name: mwmbl, disabled: false}
  # Scholarly sources rank highest in app/search_engine/quality.py, so they
  # belong in the general category the research page queries.
  - {name: crossref, disabled: false}
  - {name: openalex, disabled: false}
  - {name: google scholar, disabled: false}
  # Upstream bug: the wikidata engine raises
  # TypeError("expected string or bytes-like object, got 'list'")
  # on every query and only produces log noise.
  - {name: wikidata, disabled: true}
  # Extra image/video engines; the enabled defaults (bing/ddg/google cse)
  # are blocked or CAPTCHA-gated here.
  - {name: google images, disabled: false}
  - {name: qwant images, disabled: false}
  - {name: openverse, disabled: false}
  - {name: flickr, disabled: false}
  - {name: odysee, disabled: false}
  - {name: peertube, disabled: false}
  - {name: rumble, disabled: false}
