[project]
name = "emtedad-platform"
version = "0.1.0"
description = "Versioned Ayin-e Emtedad knowledge and publishing platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "pypdf>=6.0,<7",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "structlog>=25.4,<26",
    "uvicorn[standard]>=0.35,<1",
    "httpx>=0.28,<1",
    "youtube-transcript-api>=1.2,<2",
    "yt-dlp>=2025.9,<2027",
    "rapidfuzz>=3.14,<4",
    "pymupdf>=1.26,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "auto"
markers = [
    "integration: requires the Docker Compose PostgreSQL service",
    "source_pdf: requires the repository Ayin source PDF",
]
testpaths = ["tests"]
