name: emtedad

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emtedad}
      POSTGRES_USER: ${POSTGRES_USER:-emtedad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  searxng:
    # Emtedad search engine backend: metasearch over Google, Bing,
    # DuckDuckGo, Wikipedia, YouTube, image engines … without API keys.
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8085}:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:${SEARXNG_PORT:-8085}/
    restart: unless-stopped

volumes:
  postgres_data:
