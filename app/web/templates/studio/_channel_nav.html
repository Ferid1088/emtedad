<nav class="tabs channel-nav" aria-label="Channel workspace">
  {% for suffix, label in [
    ('', 'Overview'),
    ('/strategy', 'Strategy'),
    ('/resources', 'Resources'),
    ('/topics', 'Topics'),
    ('/production', 'Production'),
    ('/published', 'Published')
  ] %}
  {% set href = '/studio/channels/' ~ channel.slug ~ suffix %}
  <a href="{{ href }}" {% if request.url.path == href %}class="active"{% endif %}>{{ label }}</a>
  {% endfor %}
</nav>
